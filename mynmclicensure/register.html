<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — QAcademy Nurses Hub</title>
  <link rel="stylesheet" href="/mynmclicensure/css/style.css" />
  <style>
    #creatingOverlay { display:none; position:fixed; inset:0; z-index:9999;
      background:rgba(255,255,255,0.92); align-items:center; justify-content:center;
      flex-direction:column; gap:14px; }
    #creatingOverlay.show { display:flex; }
    .reg-spinner { width:44px; height:44px; border:4px solid #e0e7ef;
      border-top-color:#0ea5e9; border-radius:50%; animation:regspin .7s linear infinite; }
    @keyframes regspin { to { transform:rotate(360deg); } }
    #creatingOverlay .reg-msg { font-size:14px; font-weight:600; color:#075985; }
  </style>
</head>
<body>

<div id="creatingOverlay">
  <div class="reg-spinner"></div>
  <div class="reg-msg">Creating your account…</div>
</div>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <h1>QAcademy</h1>
      <p>Nurses Hub</p>
    </div>

    <!-- Title -->
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Join QAcademy Nurses Hub today</p>

    <!-- Alerts -->
    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <!-- Register Form -->
    <form id="registerForm">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label for="forename">First Name</label>
          <input type="text" id="forename" placeholder="First name" required />
        </div>
        <div class="form-group">
          <label for="surname">Last Name</label>
          <input type="text" id="surname" placeholder="Last name" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp Number</label>
        <input type="tel" id="phone" placeholder="e.g. 024 123 4567" required autocomplete="tel" inputmode="tel" />
      </div>

      <div class="form-group">
        <label for="program">Programme</label>
        <select id="program" required>
          <option value="">Loading programmes...</option>
        </select>
        <div id="trialHint" style="display:none; margin-top:6px; padding:8px 10px; background:#f0f9ff; border:1px solid #bae6fd; border-radius:6px; font-size:13px; color:#075985;"></div>
      </div>

      <div class="form-group">
        <label for="school">School</label>
        <select id="school" required>
          <option value="">Loading schools...</option>
        </select>
        <input type="text" id="schoolOther" placeholder="Type your school's name" style="display:none; margin-top:8px;" />
      </div>

      <div class="form-group">
        <label for="referral">How did you hear about us?</label>
        <select id="referral" required>
          <option value="">Select one</option>
          <option>WhatsApp group</option>
          <option>A friend / colleague</option>
          <option>TikTok</option>
          <option>Facebook</option>
          <option>Instagram</option>
          <option>School / lecturer</option>
          <option>Google search</option>
          <option value="__OTHER__">Other</option>
        </select>
        <input type="text" id="referralOther" placeholder="Tell us how" style="display:none; margin-top:8px;" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        Create Account
      </button>

    </form>

    <!-- Footer -->
    <div class="auth-footer">
      Already have an account? <a href="/mynmclicensure/login.html">Sign in</a>
    </div>
    <div style="text-align:center; margin-top:12px;">
      <a href="/myteacher/register.html" style="font-size:13px; color:var(--text-muted);">Signing up for MyTeacher instead?</a>
    </div>

  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/mynmclicensure/js/config.js"></script>
<script src="/mynmclicensure/js/mynmclicensure-api.js"></script>
<script>

// ── Load programmes from DB into dropdown ───────────────
// Also stores trial_product_id on each option as a data attribute
// so we can read it on form submit without a second DB call.
// Trial durations are batched-fetched once and stashed on each option
// as data-trial-days so the on-change hint shows the actual length
// the student is about to receive.
const trialDurationByProductId = new Map();

async function loadPrograms() {
    const programs = await getPrograms();
    const select = document.getElementById('program');

    if (!programs.length) {
        select.innerHTML = '<option value="">Could not load programmes</option>';
        return;
    }

    // Batch-fetch durations for every trial product referenced by the
    // programme list. One round trip; cached client-side for the
    // dropdown's change handler.
    const trialIds = programs.map(p => p.trial_product_id).filter(Boolean);
    if (trialIds.length > 0) {
        const { data: trials } = await db
            .from('products')
            .select('product_id, duration_days')
            .in('product_id', trialIds);
        (trials || []).forEach(t => {
            trialDurationByProductId.set(t.product_id, t.duration_days);
        });
    }

    select.innerHTML = '<option value="">Select your programme</option>';
    programs.forEach(p => {
        const trialDays = trialDurationByProductId.get(p.trial_product_id) || '';
        select.innerHTML += `<option
            value="${p.program_id}"
            data-trial="${p.trial_product_id || ''}"
            data-trial-days="${trialDays}">
            ${p.program_name}
        </option>`;
    });

    // Wire the change handler now that options exist.
    select.addEventListener('change', updateTrialHint);
}

// Toggle the trial-duration hint based on the selected programme.
// Reads data-trial-days off the option so duration changes in the DB
// take effect on the next page load with no code edit.
function updateTrialHint() {
    const select = document.getElementById('program');
    const hint = document.getElementById('trialHint');
    const days = select.selectedOptions[0]?.dataset?.trialDays;
    if (days && Number(days) > 0) {
        hint.textContent = `You'll get a ${days}-day free trial — no card required.`;
        hint.style.display = 'block';
    } else {
        hint.style.display = 'none';
    }
}

// ── Load schools from DB into dropdown (grouped by region) ──
// Strict pick from the NMC-accredited list, with an "isn't listed"
// escape that reveals a free-text box.
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadSchools() {
  const select = document.getElementById('school');
  const { data: schools, error } = await db
    .from('schools')
    .select('id, name, region')
    .eq('active', true)
    .order('region', { ascending: true })
    .order('name', { ascending: true });

  if (error || !schools || !schools.length) {
    select.innerHTML = '<option value="">Could not load schools</option>';
    return;
  }

  let html = '<option value="">Select your school</option>';
  let region = '';
  schools.forEach(s => {
    if (s.region !== region) {
      if (region) html += '</optgroup>';
      html += `<optgroup label="${escHtml(s.region)}">`;
      region = s.region;
    }
    html += `<option value="${s.id}">${escHtml(s.name)}</option>`;
  });
  if (region) html += '</optgroup>';
  html += '<option value="__OTHER__">My school isn\'t listed</option>';
  select.innerHTML = html;

  select.addEventListener('change', () => {
    const other = select.value === '__OTHER__';
    const box = document.getElementById('schoolOther');
    box.style.display = other ? 'block' : 'none';
    if (!other) box.value = '';
  });
}

  // ── Secure ID helper ────────────────────────────────────
  function makeSecureId(prefix, byteLength = 8) {
    const bytes = crypto.getRandomValues(new Uint8Array(byteLength));
    const hex = Array.from(bytes)
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');
    return prefix + hex.toUpperCase();
  }

  function generateUserId() {
    return makeSecureId('U_');
  }

  // ── Handle form submission ──────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const forename        = document.getElementById('forename').value.trim();
    const surname         = document.getElementById('surname').value.trim();
    const email           = document.getElementById('email').value.trim();
    const program_id      = document.getElementById('program').value;
    const phone           = document.getElementById('phone').value.trim();
    const schoolVal       = document.getElementById('school').value;
    const schoolOther     = document.getElementById('schoolOther').value.trim();
    const referralVal     = document.getElementById('referral').value;
    const referralOther   = document.getElementById('referralOther').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const submitBtn       = document.getElementById('submitBtn');
    const errorAlert      = document.getElementById('errorAlert');
    const successAlert    = document.getElementById('successAlert');

    // Reset alerts
    errorAlert.classList.remove('show');
    successAlert.classList.remove('show');

    // Validate
    if (password !== confirmPassword) {
      errorAlert.textContent = 'Passwords do not match.';
      errorAlert.classList.add('show');
      return;
    }

    if (!program_id) {
      errorAlert.textContent = 'Please select your programme.';
      errorAlert.classList.add('show');
      return;
    }

    if (phone.replace(/\D/g, '').length < 9) {
      errorAlert.textContent = 'Please enter a valid WhatsApp number.';
      errorAlert.classList.add('show');
      return;
    }

    if (!schoolVal) {
      errorAlert.textContent = 'Please select your school.';
      errorAlert.classList.add('show');
      return;
    }
    if (schoolVal === '__OTHER__' && !schoolOther) {
      errorAlert.textContent = "Please type your school's name.";
      errorAlert.classList.add('show');
      return;
    }

    if (!referralVal) {
      errorAlert.textContent = 'Please tell us how you heard about us.';
      errorAlert.classList.add('show');
      return;
    }
    if (referralVal === '__OTHER__' && !referralOther) {
      errorAlert.textContent = 'Please tell us how you heard about us.';
      errorAlert.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    document.getElementById('creatingOverlay').classList.add('show');

    // ── Step 1: Create Supabase Auth account ────────────
    const { data, error } = await db.auth.signUp({ email, password });

    if (error) {
      errorAlert.textContent = error.message;
      errorAlert.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      document.getElementById('creatingOverlay').classList.remove('show');
      return;
    }

    const userId = generateUserId();

    // ── Step 2: Create user profile ─────────────────────
    const { error: profileError } = await db
      .from('users')
      .insert({
        user_id:       userId,
        auth_id:       data.user.id,
        email:         email,
        forename:      forename,
        surname:       surname,
        name:          forename + ' ' + surname,
        program_id:    program_id,
        role:            'STUDENT',
        active:          true,
        signup_source:   'SUPABASE_AUTH',
        phone_number:    phone,
        school_id:       schoolVal === '__OTHER__' ? null : Number(schoolVal),
        school_other:    schoolVal === '__OTHER__' ? schoolOther : null,
        referral_source: referralVal === '__OTHER__' ? referralOther : referralVal
      });

    if (profileError) {
      errorAlert.textContent = 'Account created but profile setup failed. Please contact support.';
      errorAlert.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      document.getElementById('creatingOverlay').classList.remove('show');
      return;
    }

// ── Step 3: Auto-assign programme trial ─────────────
// Registration does its own direct insert — separate from admin grants
// source = SELF_TRIAL_SIGNUP so we can identify these in the DB
const selectedOption = document.getElementById('program').selectedOptions[0];
const trialProductId = selectedOption?.dataset?.trial || '';

if (trialProductId) {
    // Get product details to calculate expiry
    const { data: trialProduct } = await db
        .from('products')
        .select('duration_days')
        .eq('product_id', trialProductId)
        .maybeSingle();

    if (trialProduct) {
        const start   = new Date();
        const expires = new Date(start);
        expires.setDate(expires.getDate() + trialProduct.duration_days);

        const subscriptionId = makeSecureId('SUB_');

        await db.from('subscriptions').insert({
            subscription_id : subscriptionId,
            user_id         : userId,
            product_id      : trialProductId,
            start_utc       : start.toISOString(),
            expires_utc     : expires.toISOString(),
            status          : 'ACTIVE',
            source          : 'SELF_TRIAL_SIGNUP',
            source_ref      : userId,
            expiry_reminded : false
        });
    }
}

    // ── Step 4: Success ──────────────────────────────────
    successAlert.textContent = 'Account created! Redirecting to login...';
    successAlert.classList.add('show');

    // ── Step 5: Send welcome email (fire-and-forget) ────
    try {
      const programText = document.getElementById('program').selectedOptions[0]?.textContent?.trim() || '';
      await fetch(EMAIL_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          secret: EMAIL_SECRET,
          event: 'WELCOME_STUDENT',
          data: {
            name: forename,
            email: email,
            loginUrl: window.location.origin + '/mynmclicensure/login.html',
            programName: programText
          }
        })
      });
    } catch (emailErr) {
      console.error('Welcome email failed (non-blocking):', emailErr);
    }

    // Sign out so the user arrives at login.html with a clean
    // state — avoids onAuthStateChange deadlock from the signUp session
    await db.auth.signOut();

    setTimeout(() => {
      window.location.href = '/mynmclicensure/login.html';
    }, 2000);

  });

  // Load programmes + schools on page load
  loadPrograms();
  loadSchools();

  // Reveal the "Other" text box when chosen in the referral dropdown
  document.getElementById('referral').addEventListener('change', (e) => {
    const other = e.target.value === '__OTHER__';
    const box = document.getElementById('referralOther');
    box.style.display = other ? 'block' : 'none';
    if (!other) box.value = '';
  });

</script>

</body>
</html>
