<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAcademy — Nurses Hub</title>
  <style>
    :root {
      --primary:    #1e3a5f;
      --accent:     #2d7d72;
      --text-muted: #6b7280;
      --border:     #e5e7eb;
      --bg:         #f9fafb;
      --white:      #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }
    .product-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      text-align: left;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .product-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(45,125,114,0.12);
    }
    .product-icon { font-size: 32px; flex-shrink: 0; }
    .product-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 3px;
    }
    .product-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .footer {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/images/QAcademy_Logo.png" alt="QAcademy" class="logo" />
    <h1>QAcademy</h1>
    <p class="tagline">Professional learning tools for healthcare education in Ghana.</p>

    <div class="product-grid">
      <a href="/mynmclicensure/index.html" class="product-card">
        <div class="product-icon">🏥</div>
        <div>
          <div class="product-name">MyNMC Licensure</div>
          <div class="product-desc">Exam prep for nursing students preparing for NMC licensure.</div>
        </div>
      </a>
      <a href="/myteacher/login.html" class="product-card">
        <div class="product-icon">👨‍🏫</div>
        <div>
          <div class="product-name">MyTeacher</div>
          <div class="product-desc">Class-based assessment tools for teachers and institutions.</div>
        </div>
      </a>
    </div>

    <p class="footer">© 2025 QAcademy. All rights reserved.</p>
  </div>
</body>
</html>
