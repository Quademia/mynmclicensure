<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QAcademy — Redirecting…</title>
  <link rel="stylesheet" href="/mynmclicensure/css/style.css" />
  <style>
    .router-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg, #f8fafc);
    }
    .router-card {
      background: var(--white, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(30,58,95,0.06);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(30,58,95,0.12);
      border-top-color: var(--primary, #1e3a5f);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .router-msg {
      font-size: 15px; font-weight: 600;
      color: var(--primary, #1e3a5f); margin: 0 0 6px;
    }
    .router-sub {
      font-size: 13px; color: var(--text-muted, #64748b); margin: 0;
    }
  </style>
</head>
<body>

<div class="router-wrap">
  <div class="router-card">
    <div class="spinner"></div>
    <p class="router-msg" id="routerMsg">Checking your session…</p>
    <p class="router-sub" id="routerSub">You'll be redirected in a moment.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/mynmclicensure/js/config.js"></script>
<script src="/mynmclicensure/js/paths.js"></script>
<script>

  async function route() {
    // 1. Check Supabase auth session
    const { data: { session } } = await db.auth.getSession();
    if (!session) {
      window.location.href = '/mynmclicensure/login.html';
      return;
    }

    // 2. Look up user in public.users (Licensure table)
    const { data: profile } = await db
      .from('users')
      .select('user_id, role, active')
      .eq('auth_id', session.user.id)
      .maybeSingle();

    if (!profile || !profile.active) {
      await db.auth.signOut();
      window.location.href = '/mynmclicensure/login.html';
      return;
    }

    // 3. Route by role
    const role = (profile.role || '').toUpperCase();

    if (role === 'ADMIN') {
      window.location.href = LICENSURE.admin + '/dashboard.html';
    } else {
      // STUDENT or any other role
      window.location.href = LICENSURE.student + '/dashboard.html';
    }
  }

  route();

</script>

</body>
</html>
