<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyTeacher — QAcademy</title>
  <style>
    :root {
      --primary:    #1e3a5f;
      --accent:     #2d7d72;
      --text-muted: #6b7280;
      --border:     #e5e7eb;
      --bg:         #f9fafb;
      --white:      #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .wrap {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(45,125,114,0.1);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 30px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }
    .btn-primary {
      display: block;
      padding: 14px 24px;
      background: var(--accent);
      color: var(--white);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #245f56; }
    .btn-secondary {
      display: block;
      padding: 14px 24px;
      background: var(--white);
      color: var(--primary);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }
    .divider {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .back-link {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--primary); }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/images/QAcademy_Logo.png" alt="QAcademy" class="logo" />
    <div class="badge">MyTeacher</div>
    <h1>Class-based assessment for educators</h1>
    <p class="tagline">
      Create classes, build question banks, assign quizzes,
      and track student results — all in one place.
    </p>

    <div class="btn-grid">
      <a href="/myteacher/login.html" class="btn-primary">Log in</a>
      <a href="/myteacher/register.html" class="btn-secondary">Create an account</a>
    </div>

    <div class="divider">─────────────────</div>
    <a href="/index.html" class="back-link">← Back to QAcademy</a>

    <p class="footer">© 2025 QAcademy. All rights reserved.</p>
  </div>
</body>
</html>
